name: Android unsigned APK

on:
  workflow_dispatch:

concurrency:
  group: android-unsigned-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned .apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify OTA configuration
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "expo.modules.updates.EXPO_UPDATE_URL" "$MANIFEST"
          grep -q "expo.modules.updates.EXPO_RUNTIME_VERSION" "$MANIFEST"
          grep -q "expo.modules.updates.UPDATES_CONFIGURATION_REQUEST_HEADERS_KEY" "$MANIFEST"
          grep -n "expo.modules.updates" "$MANIFEST"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Package APK
        run: |
          APK="$(ls -d android/app/build/outputs/apk/release/*.apk | head -n1)"
          echo "apk=$APK"
          cp "$APK" Pyloxdactyl-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pyloxdactyl-android-unsigned
          path: Pyloxdactyl-unsigned.apk
          if-no-files-found: error
          retention-days: 14
