name: Android unsigned APK

on:
  workflow_dispatch:

concurrency:
  group: android-unsigned-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned .apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify OTA configuration
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "expo.modules.updates.EXPO_UPDATE_URL" "$MANIFEST"
          grep -q "expo.modules.updates.EXPO_RUNTIME_VERSION" "$MANIFEST"
          grep -q "expo.modules.updates.UPDATES_CONFIGURATION_REQUEST_HEADERS_KEY" "$MANIFEST"
          grep -n "expo.modules.updates" "$MANIFEST"

      - name: Tune Gradle memory
        run: |
          set -e
          PROPS="android/gradle.properties"
          sed -i '/^org.gradle.jvmargs=/d' "$PROPS"
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError' >> "$PROPS"
          echo 'org.gradle.parallel=true' >> "$PROPS"
          echo 'org.gradle.caching=true' >> "$PROPS"
          cat "$PROPS"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prebundle JS
        run: npx expo export:embed --platform android --dev false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --build-cache -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Package APK
        run: |
          APK="$(ls -d android/app/build/outputs/apk/release/*.apk | head -n1)"
          echo "apk=$APK"
          cp "$APK" Pyloxdactyl-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pyloxdactyl-android-unsigned
          path: Pyloxdactyl-unsigned.apk
          if-no-files-found: error
          retention-days: 14
